<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#11110f">
<meta name="author" content="Calvin-Khang Ta">
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="/icon.ico">
<title>{{ if .IsHome }}{{ .Site.Title }} — Research{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<script>try{const t=localStorage.getItem('ckt-theme');if(t==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
{{ $style := resources.Get "css/editorial.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
<script defer src="/js/theme-toggle.js"></script>
